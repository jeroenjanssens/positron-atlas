[workspace]
resolver = "2"
members = ["atlas-core", "atlas-core-py", "bench-ann"]
# bench-ann (index comparison, not shipped) only builds when asked: cargo run -p bench-ann
default-members = ["atlas-core", "atlas-core-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
